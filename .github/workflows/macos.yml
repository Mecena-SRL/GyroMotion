name: Build standalone macOS OFX
on: workflow_dispatch
permissions:
  contents: read
jobs:
  arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: bash release/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MecenaMotion-macOS
          path: dist/*.zip
